---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-bankapp-blue
  namespace: webapps
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: bankapp
      version: blue
  strategy: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: bankapp
        version: blue
    spec:
      containers:
        - name: bankapp-container
          image: zookl0/bankapp:blue
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-service:3306/bankappdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              port: 8080
              path: /
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 3